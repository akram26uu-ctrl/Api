[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ordium-control-plane"
version = "0.1.0"
description = "ORDIUM SaaS control plane for user accounts, organizations, and sessions."
requires-python = ">=3.13,<4.0"
dependencies = [
  "fastapi>=0.133.1,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "alembic>=1.15,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "httpx>=0.28.1,<1.0",
  "cryptography>=50.0.0,<51.0.0",
  "email-validator>=2.2,<3.0",
]


[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
  "httpx>=0.28.1,<1.0",
  "cryptography>=50.0.0,<51.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
