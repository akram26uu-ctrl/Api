# Install to /etc/nginx/conf.d/ordium.conf, then let certbot add TLS (certbot --nginx).
limit_req_zone $binary_remote_addr zone=ordium_general:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ordium.dev www.ordium.dev;
    client_max_body_size 1m;

    location / {
        limit_req zone=ordium_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ordium.dev;
    client_max_body_size 1m;

    # Control Plane reaches this directly at http://api:8000 inside Compose.
    location ^~ /internal/ {
        return 404;
    }

    location / {
        limit_req zone=ordium_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
