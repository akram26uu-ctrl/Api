# Install to /etc/nginx/conf.d/ordium.conf, then let certbot add TLS (certbot --nginx).
limit_req_zone $binary_remote_addr zone=ordium_general:10m rate=20r/s;
# Store webhooks arrive in bursts from a platform's shared IPs (flash sales).
limit_req_zone $binary_remote_addr zone=ordium_webhooks:10m rate=100r/s;
# 429 tells clients and store platforms to slow down; the default 503 reads as an outage.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name ordium.dev www.ordium.dev;
    client_max_body_size 1m;

    location / {
        limit_req zone=ordium_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ordium.dev;
    client_max_body_size 1m;

    # Control Plane reaches this directly at http://api:8000 inside Compose.
    location ^~ /internal/ {
        return 404;
    }

    # Store webhook receivers only; connection management keeps the general limit.
    location ~ ^/api/v1/integrations/(webhooks/|shopify/webhook$|omniterra/webhook$) {
        limit_req zone=ordium_webhooks burst=300 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=ordium_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
