name: ORDIUM validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        run: python -m pytest

  control-plane-tests:
    name: Control Plane tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml
      - name: Install Control Plane and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Control Plane tests
        run: python -m pytest

  web-validation:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Test same-origin proxy path validation
        run: node --test proxy-utils.test.mjs
      - name: Check web server syntax
        run: node --check server.mjs
      - name: Build web app
        run: npm run build

  container-builds:
    name: Docker Compose validation and multi-architecture builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration (no services started)
        run: docker compose --env-file deploy/ec2/env.example -f compose.ec2.yaml config --quiet
      - name: Build API image for AMD64 and ARM64
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=oci,dest=/tmp/ordium-api.tar -f api/Dockerfile api
      - name: Build Control Plane image for AMD64 and ARM64
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=oci,dest=/tmp/ordium-control-plane.tar -f control-plane/Dockerfile control-plane
      - name: Build Web image for AMD64 and ARM64
        run: docker buildx build --platform linux/amd64,linux/arm64 --output=type=oci,dest=/tmp/ordium-web.tar -f web/Dockerfile web
