name: ORDIUM validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run API tests
        run: python -m pytest

  web-validation:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Build web app
        run: npm run build
