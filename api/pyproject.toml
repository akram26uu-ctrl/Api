[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ordium-api"
version = "1.5.2"
description = "Multi-tenant fraud and fake-order risk API for e-commerce."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
  "fastapi>=0.133.1,<1.0",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "alembic>=1.15,<2.0",
  "cryptography>=50.0.0,<51.0",
  "packaging>=24.2,<27.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10.0",
  "httpx>=0.28.1,<1.0",
]
security = [
  "bandit>=1.8,<2.0",
  "pip-audit>=2.9,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.alembic]
script_location = "migrations"
